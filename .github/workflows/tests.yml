# The stock-free unit tests of tools/ (test/unit, docs/building.md#mutation-tests) on every pull
# request and push to main, so a regression shows before a merge. Needs no stock firmware or Q2.
# The run counts its coverage of tools/ and fails under the floor (docs/building.md#coverage).
name: Unit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Named, so a step's pipe keeps pipefail: tee would otherwise hide coverage's exit status.
defaults:
  run:
    shell: bash

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - run: pip install -r requirements.txt -r test/unit/requirements.txt
      - run: coverage run -m pytest test/unit -q
      - name: Coverage of tools/  # fails under pyproject.toml's fail_under
        if: ${{ !cancelled() }}
        run: coverage report --format=markdown | tee -a "$GITHUB_STEP_SUMMARY"
