# The stock-free unit tests of tools/ (test/unit, docs/building.md#mutation-tests) on every pull
# request and push to main, so a regression shows before a merge. Needs no stock firmware or Q2.
name: Unit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - run: pip install -r requirements.txt -r test/unit/requirements.txt
      - run: python3 -m pytest test/unit -q
