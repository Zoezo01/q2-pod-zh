name: Format custom App Store C source

on:
  push:
    branches: [app-store-custom-repo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format with the exact CI version
        run: |
          python -m pip install clang-format==23.1.5
          clang-format -i patch/netupdate.c
          clang-format --dry-run --Werror patch/netupdate.c
      - name: Commit formatting fix
        run: |
          if ! git diff --quiet -- patch/netupdate.c; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add patch/netupdate.c
            git commit -m 'style: clang-format netupdate.c for upstream CI'
            git push origin HEAD:app-store-custom-repo
          fi
