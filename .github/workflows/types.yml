# mypy over tools/ and the stock-free tests on every pull request and push to main, so a misspelt
# name or a None used as a value shows before a merge; see docs/building.md#type-check.
name: Type check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r test/unit/requirements.txt mypy==2.4.1
      - run: mypy tools test/unit
      - run: mypy test/fw  # its own run: test/unit has a conftest module too
        if: ${{ !cancelled() }}
