<!-- Home's no-cover note: an original drawing, white in varying alpha, 100 x 115. tools/art.py rasterises this
     file's paths and gradients at build time: its shape filled in shape_fill and stroked at .42, and the gloss,
     clipped to the shape, in gloss_fill faded across by gloss_fade. It draws at screen (227, 83): screen is this
     drawing's coordinates plus (5, 17). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="222 66 100 115">
  <defs>
    <linearGradient id="shape_fill" gradientUnits="userSpaceOnUse" x1="0" y1="70" x2="0" y2="178">
      <stop offset="0" stop-color="#fff" stop-opacity=".52"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="gloss_fill" gradientUnits="userSpaceOnUse" x1="0" y1="70" x2="0" y2="160">
      <stop offset=".58" stop-color="#fff"/>
      <stop offset=".8" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss_fade" gradientUnits="userSpaceOnUse" x1="285" y1="0" x2="317" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#777"/>
    </linearGradient>
    <clipPath id="shape_clip">
      <path id="shape" d="M254 82.5 317 71.5V156A16 12.5 -12 1 1 308.5 145.5V101L262 109.5V165A17 12.5 -12 1 1 254 153.5Z"/>
    </clipPath>
    <mask id="gloss_mask" maskUnits="userSpaceOnUse" x="222" y="66" width="100" height="115">
      <rect x="222" y="66" width="100" height="115" fill="url(#gloss_fade)"/>
    </mask>
  </defs>
  <g clip-path="url(#shape_clip)">
    <path d="M254 82.5 317 71.5V156A16 12.5 -12 1 1 308.5 145.5V101L262 109.5V165A17 12.5 -12 1 1 254 153.5Z" fill="url(#shape_fill)"/>
    <path id="gloss" d="M254 70H320V73C300 82 275 95 262 112V178H254Z" fill="url(#gloss_fill)" mask="url(#gloss_mask)"/>
  </g>
  <path d="M254 82.5 317 71.5V156A16 12.5 -12 1 1 308.5 145.5V101L262 109.5V165A17 12.5 -12 1 1 254 153.5Z" fill="none" stroke="#fff" stroke-opacity=".42"/>
</svg>
